<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Sreekar Sarma - hello from Octy">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e5a7e"/>
      <stop offset="0.55" stop-color="#083a5a"/>
      <stop offset="1" stop-color="#03182b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.35">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffb3c1"/>
      <stop offset="0.6" stop-color="#ff7a93"/>
      <stop offset="1" stop-color="#e0567a"/>
    </radialGradient>
    <clipPath id="frame"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="url(#sea)"/>
    <rect width="900" height="300" fill="url(#glow)"/>

    <!-- light rays -->
    <g fill="#ffffff">
      <polygon points="120,0 190,0 330,300 220,300" opacity="0.05">
        <animate attributeName="opacity" values="0.03;0.08;0.03" dur="7s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="380,0 430,0 560,300 470,300" opacity="0.04">
        <animate attributeName="opacity" values="0.06;0.02;0.06" dur="9s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="610,0 680,0 820,300 700,300" opacity="0.05">
        <animate attributeName="opacity" values="0.02;0.07;0.02" dur="8s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- seaweed -->
    <g fill="none" stroke-linecap="round">
      <path d="M30,300 C20,270 45,250 32,220 C22,195 42,180 34,160" stroke="#1f9e7a" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="-3 30 300;3 30 300;-3 30 300" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M52,300 C62,275 40,255 55,232 C66,212 48,200 56,185" stroke="#2bc497" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate" values="3 52 300;-3 52 300;3 52 300" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M865,300 C875,272 852,252 866,226 C878,204 860,190 868,172" stroke="#1f9e7a" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" values="2 865 300;-3 865 300;2 865 300" dur="5.5s" repeatCount="indefinite"/>
      </path>
      <path d="M842,300 C834,280 852,262 840,242" stroke="#2bc497" stroke-width="5">
        <animateTransform attributeName="transform" type="rotate" values="-3 842 300;3 842 300;-3 842 300" dur="4.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- sand -->
    <path d="M0,282 C120,268 220,292 360,280 C500,268 620,292 760,278 C830,272 870,282 900,278 L900,300 L0,300 Z" fill="#d9b77a" opacity="0.45"/>

    <!-- title -->
    <g font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif">
      <text x="70" y="118" font-size="20" fill="#8fd3ff" letter-spacing="3">HELLO FROM OCTY</text>
      <text x="68" y="175" font-size="58" font-weight="700" fill="#e9f8ff">Sreekar Sarma</text>
      <text x="70" y="212" font-size="18" fill="#b7e4f9" font-style="italic">a curious octopus with way too many tabs open</text>
    </g>

    <!-- octy jr. -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4s" repeatCount="indefinite"/>

      <!-- speech bubble -->
      <g>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.6;0.7;1" dur="6s" repeatCount="indefinite"/>
        <path d="M566,52 h56 a12,12 0 0 1 12,12 v14 a12,12 0 0 1 -12,12 h-30 l-10,10 l0,-10 h-16 a12,12 0 0 1 -12,-12 v-14 a12,12 0 0 1 12,-12 z" fill="#ffffff" opacity="0.95"/>
        <text x="594" y="78" text-anchor="middle" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="18" font-weight="700" fill="#e0567a">hi!</text>
      </g>

      <!-- tentacles: short, chubby, curly -->
      <g fill="none" stroke="url(#skin)" stroke-width="16" stroke-linecap="round">
        <path d="M672,140 C644,134 630,108 640,90 C648,76 664,82 658,94">
          <animateTransform attributeName="transform" type="rotate" values="-10 674 142;12 674 142;-10 674 142" dur="1.4s" repeatCount="indefinite"/>
        </path>
        <path d="M680,160 C660,172 650,192 664,204 C674,212 686,202 677,195">
          <animateTransform attributeName="transform" type="rotate" values="-4 680 160;4 680 160;-4 680 160" dur="3s" repeatCount="indefinite"/>
        </path>
        <path d="M699,170 C690,190 690,210 704,216 C715,220 719,207 709,204">
          <animateTransform attributeName="transform" type="rotate" values="4 699 170;-4 699 170;4 699 170" dur="3.4s" repeatCount="indefinite"/>
        </path>
        <path d="M719,174 C716,194 720,212 734,216 C744,218 746,206 737,204">
          <animateTransform attributeName="transform" type="rotate" values="-3 719 174;3 719 174;-3 719 174" dur="2.8s" repeatCount="indefinite"/>
        </path>
        <path d="M740,174 C746,194 744,210 756,214 C766,216 768,203 758,201">
          <animateTransform attributeName="transform" type="rotate" values="3 740 174;-4 740 174;3 740 174" dur="3.2s" repeatCount="indefinite"/>
        </path>
        <path d="M758,168 C776,182 786,198 778,210 C771,219 759,211 766,203">
          <animateTransform attributeName="transform" type="rotate" values="-4 758 168;4 758 168;-4 758 168" dur="3.6s" repeatCount="indefinite"/>
        </path>
        <path d="M776,152 C798,158 810,174 803,188 C798,197 787,193 791,184">
          <animateTransform attributeName="transform" type="rotate" values="4 776 152;-5 776 152;4 776 152" dur="2.9s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- head: big, round, squishy -->
      <path d="M664,138 C664,86 694,60 725,60 C756,60 786,86 786,138 C786,164 760,178 725,178 C690,178 664,164 664,138 Z" fill="url(#skin)"/>
      <ellipse cx="700" cy="84" rx="14" ry="8" fill="#ffffff" opacity="0.35" transform="rotate(-30 700 84)"/>
      <g fill="#ffd1dc" opacity="0.75">
        <circle cx="752" cy="82" r="5"/>
        <circle cx="766" cy="98" r="3"/>
        <circle cx="738" cy="72" r="2.5"/>
      </g>

      <!-- little bow -->
      <g transform="translate(754,66) rotate(18)">
        <path d="M0,0 L-14,-9 L-14,9 Z" fill="#7c4dff"/>
        <path d="M0,0 L14,-9 L14,9 Z" fill="#7c4dff"/>
        <circle r="4" fill="#b388ff"/>
      </g>

      <!-- big sparkly eyes -->
      <g fill="#2a1b3d">
        <ellipse cx="705" cy="126" rx="10" ry="12">
          <animate attributeName="ry" values="12;12;1.2;12" keyTimes="0;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="745" cy="126" rx="10" ry="12">
          <animate attributeName="ry" values="12;12;1.2;12" keyTimes="0;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.9;0.95;1" dur="4.5s" repeatCount="indefinite"/>
        <circle cx="709" cy="120" r="4"/>
        <circle cx="749" cy="120" r="4"/>
        <circle cx="702" cy="131" r="1.8"/>
        <circle cx="742" cy="131" r="1.8"/>
      </g>

      <!-- blush + tiny smile -->
      <ellipse cx="687" cy="146" rx="9" ry="5" fill="#ff4f7b" opacity="0.55"/>
      <ellipse cx="763" cy="146" rx="9" ry="5" fill="#ff4f7b" opacity="0.55"/>
      <path d="M716,145 Q720.5,151 725,145 Q729.5,151 734,145" fill="none" stroke="#2a1b3d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- sparkles -->
    <g fill="#fff3b0">
      <path d="M612,150 l3,-9 l3,9 l9,3 l-9,3 l-3,9 l-3,-9 l-9,-3 z" opacity="0.8">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M826,92 l2,-6 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 z">
        <animate attributeName="opacity" values="0.9;0;0.9" dur="3.1s" repeatCount="indefinite"/>
      </path>
      <path d="M800,240 l2,-6 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 z">
        <animate attributeName="opacity" values="0;0.8;0" dur="3.7s" begin="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- bubbles -->
    <g fill="#bfeaff" fill-opacity="0.15" stroke="#d9f4ff" stroke-opacity="0.7" stroke-width="1.5">
      <circle cx="770" cy="320" r="5">
        <animate attributeName="cy" values="110;-20" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="770;778;766;772" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="782" cy="320" r="3">
        <animate attributeName="cy" values="110;-20" dur="5s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="782;774;786;780" dur="5s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="320" r="6">
        <animate attributeName="cy" values="320;-20" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="120;132;114;124" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="320" r="4">
        <animate attributeName="cy" values="320;-20" dur="7s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="300;292;306;298" dur="7s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="320" r="7">
        <animate attributeName="cy" values="320;-20" dur="10s" begin="4s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="520;530;512;522" dur="10s" begin="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="320" r="3">
        <animate attributeName="cy" values="320;-20" dur="6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="320" r="4">
        <animate attributeName="cy" values="320;-20" dur="8s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
