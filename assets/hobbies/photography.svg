<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="photo-mantle" x1="50" y1="10" x2="50" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A3D48"/>
      <stop offset=".55" stop-color="#0F1A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="photo-glow" cx="50" cy="42" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2C7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00C2C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="42" r="38" fill="url(#photo-glow)"/>

  <!-- tentacles tucked behind the camera -->
  <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
    <path d="M40 60 C35 68.5 33 78.5 37 85"/>
    <path d="M50 61.5 C48 71 52 80 50 87"/>
    <path d="M60 60 C65 68.5 67 78.5 63 85"/>
  </g>
  <g fill="#C800FF" opacity=".6">
    <circle cx="35.1" cy="73.3" r="1.3"/>
    <circle cx="50" cy="75.2" r="1.3"/>
    <circle cx="64.9" cy="73.3" r="1.3"/>
  </g>

  <!-- arms gripping the camera body -->
  <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
    <path d="M30 52 C20 58 16 66 20.5 74"/>
    <path d="M70 52 C80 58 84 66 79.5 74"/>
  </g>

  <!-- mantle -->
  <path d="M26 44 C26 23.5 36 12 50 12 C64 12 74 23.5 74 44 C74 55.5 63.5 62 50 62 C36.5 62 26 55.5 26 44 Z" fill="url(#photo-mantle)" stroke="#00C2C7" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 41 C31.5 26 38.5 17 45 16" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
  <circle cx="37.5" cy="25" r="1.2" fill="#1AFFD5" opacity=".3"/>
  <circle cx="61" cy="23" r="1.2" fill="#1AFFD5" opacity=".24"/>

  <!-- eyes, watching the shot -->
  <circle cx="42" cy="38" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="58" cy="38" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="42.6" cy="39.4" r="2.4" fill="#07090F"/>
  <circle cx="58.6" cy="39.4" r="2.4" fill="#07090F"/>
  <circle cx="40" cy="35.9" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="56" cy="35.9" r="1" fill="#FFFFFF" opacity=".85"/>

  <!-- camera, held out front -->
  <g transform="translate(20 60)">
    <path d="M20 7 V2 H33 V7" fill="#0D1117" stroke="#FF00C8" stroke-width="3.4" stroke-linejoin="round"/>
    <rect x="0" y="6" width="60" height="26" rx="5.5" fill="#0D1117" stroke="#FF00C8" stroke-width="3.6"/>
    <circle cx="25" cy="19" r="9" fill="#0D1117" stroke="#FF00C8" stroke-width="3.4"/>
    <circle cx="25" cy="19" r="3.6" fill="#1AFFD5"/>
    <circle cx="49" cy="13" r="2.6" fill="#1AFFD5" opacity=".8"/>
  </g>
</svg>
