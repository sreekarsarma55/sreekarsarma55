<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="music-mantle" x1="50" y1="10" x2="50" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A3D48"/>
      <stop offset=".55" stop-color="#0F1A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="music-glow" cx="50" cy="42" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2C7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00C2C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="42" r="38" fill="url(#music-glow)"/>

  <!-- headphone band, behind the mantle -->
  <path d="M21 36 C21 8 79 8 79 36" stroke="#FF00C8" stroke-width="3.6" stroke-linecap="round"/>

  <!-- full tentacle skirt -->
  <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
    <path d="M31 55 C23.5 63 19 73.5 22 82"/>
    <path d="M40 60 C35 68.5 33 78.5 37 85"/>
    <path d="M50 61.5 C48 71 52 80 50 87"/>
    <path d="M60 60 C65 68.5 67 78.5 63 85"/>
    <path d="M69 55 C76.5 63 81 73.5 78 82"/>
  </g>
  <g fill="#C800FF" opacity=".6">
    <circle cx="22.6" cy="68.3" r="1.3"/>
    <circle cx="21.1" cy="76.7" r="1.3"/>
    <circle cx="35.1" cy="73.3" r="1.3"/>
    <circle cx="35.3" cy="80.7" r="1.3"/>
    <circle cx="50" cy="75.2" r="1.3"/>
    <circle cx="50.6" cy="82.6" r="1.3"/>
    <circle cx="64.9" cy="73.3" r="1.3"/>
    <circle cx="64.7" cy="80.7" r="1.3"/>
    <circle cx="77.4" cy="68.3" r="1.3"/>
    <circle cx="78.9" cy="76.7" r="1.3"/>
  </g>

  <!-- mantle -->
  <path d="M26 44 C26 23.5 36 12 50 12 C64 12 74 23.5 74 44 C74 55.5 63.5 62 50 62 C36.5 62 26 55.5 26 44 Z" fill="url(#music-mantle)" stroke="#00C2C7" stroke-width="4" stroke-linejoin="round"/>
  <path d="M33 41 C32.5 28 38 20 44 18" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>

  <!-- eyes, blissed out -->
  <circle cx="42" cy="40" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="58" cy="40" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="42" cy="41" r="2.4" fill="#07090F"/>
  <circle cx="58" cy="41" r="2.4" fill="#07090F"/>
  <circle cx="39.8" cy="37.9" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="55.8" cy="37.9" r="1" fill="#FFFFFF" opacity=".85"/>

  <!-- ear cups -->
  <rect x="14" y="30" width="15" height="22" rx="7.5" fill="#0D1117" stroke="#FF00C8" stroke-width="3.6"/>
  <rect x="71" y="30" width="15" height="22" rx="7.5" fill="#0D1117" stroke="#FF00C8" stroke-width="3.6"/>
  <path d="M21.5 36.5 V45.5" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>
  <path d="M78.5 36.5 V45.5" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".6"/>

  <!-- note in the water -->
  <g transform="translate(76 60)">
    <path d="M4 16 V2 L17 -1.5 V12" stroke="#1AFFD5" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-.5" cy="16.5" r="4.8" fill="#1AFFD5"/>
    <circle cx="12.5" cy="13" r="4.8" fill="#1AFFD5"/>
  </g>
</svg>
