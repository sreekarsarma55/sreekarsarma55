<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cook-mantle" x1="50" y1="10" x2="50" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A3D48"/>
      <stop offset=".55" stop-color="#0F1A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="cook-glow" cx="50" cy="42" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2C7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00C2C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="42" r="38" fill="url(#cook-glow)"/>

  <!-- tentacles peeking out under the pot -->
  <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
    <path d="M40 60 C35 68.5 33 78.5 37 85"/>
    <path d="M60 60 C65 68.5 67 78.5 63 85"/>
  </g>

  <!-- arm stirring with a spoon -->
  <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
    <path d="M29 52 C19 55 14 61 16 68"/>
    <path d="M71 52 C80 50 85 44 84 36"/>
  </g>
  <path d="M84 36 L80 62" stroke="#FF00C8" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="84.5" cy="31" rx="3.6" ry="5" fill="#0D1117" stroke="#FF00C8" stroke-width="2.6"/>

  <!-- mantle -->
  <path d="M26 44 C26 23.5 36 12 50 12 C64 12 74 23.5 74 44 C74 55.5 63.5 62 50 62 C36.5 62 26 55.5 26 44 Z" fill="url(#cook-mantle)" stroke="#00C2C7" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 43 C31.5 34 33 29 35 26" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>

  <!-- chef hat -->
  <path d="M35 20 C27 20 26.5 8 35.5 9 C37.5 3 47 2.5 50 7 C53 2.5 62.5 3 64.5 9 C73.5 8 73 20 65 20 Z" fill="#0D1117" stroke="#FF00C8" stroke-width="3" stroke-linejoin="round"/>
  <rect x="35" y="19" width="30" height="7" rx="2" fill="#0D1117" stroke="#FF00C8" stroke-width="3"/>
  <path d="M44 12 C45 10 47 9.5 49 10" stroke="#1AFFD5" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>

  <!-- eyes, proud of the dish -->
  <circle cx="42" cy="39" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="58" cy="39" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="42.4" cy="40.2" r="2.4" fill="#07090F"/>
  <circle cx="58.4" cy="40.2" r="2.4" fill="#07090F"/>
  <circle cx="40" cy="36.9" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="56" cy="36.9" r="1" fill="#FFFFFF" opacity=".85"/>
  <path d="M46.5 49 Q50 52 53.5 49" stroke="#F0F0F0" stroke-width="1.8" stroke-linecap="round"/>

  <!-- pot, with steam -->
  <g stroke="#1AFFD5" stroke-width="2.4" stroke-linecap="round" opacity=".7">
    <path d="M42 70 C40 67 44 65 42 62"/>
    <path d="M52 70 C50 67 54 65 52 62"/>
    <path d="M62 70 C60 67 64 65 62 62"/>
  </g>
  <g transform="translate(26 70)">
    <path d="M-3 4 H51" stroke="#FF00C8" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M2 4 V18 C2 22 5 25 9 25 H39 C43 25 46 22 46 18 V4" fill="#0D1117" stroke="#FF00C8" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M-2 10 H2 M46 10 H50" stroke="#FF00C8" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="2.2" fill="#1AFFD5" opacity=".8"/>
  </g>
