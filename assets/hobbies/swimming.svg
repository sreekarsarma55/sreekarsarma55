<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="swim-mantle" x1="50" y1="10" x2="50" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A3D48"/>
      <stop offset=".55" stop-color="#0F1A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="swim-glow" cx="50" cy="40" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2C7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00C2C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="40" r="38" fill="url(#swim-glow)"/>

  <g transform="rotate(-17 50 42)">
    <!-- tentacles streaming out behind -->
    <g stroke="#00C2C7" stroke-width="4" stroke-linecap="round">
      <path d="M29 50 C15 49 6 55 5 65"/>
      <path d="M30 58 C18 61 10 69 12 78"/>
      <path d="M41 63 C32 70 29 79 33 86"/>
      <path d="M59 62 C66 70 65 79 58 85"/>
      <path d="M70 54 C81 57 86 65 83 74"/>
    </g>
    <g fill="#C800FF" opacity=".6">
      <circle cx="16.8" cy="53.9" r="1.3"/>
      <circle cx="8.4" cy="57.4" r="1.3"/>
      <circle cx="19.5" cy="66.3" r="1.3"/>
      <circle cx="13.1" cy="72.9" r="1.3"/>
      <circle cx="33.9" cy="72.5" r="1.3"/>
      <circle cx="31" cy="80.2" r="1.3"/>
      <circle cx="62.4" cy="71.6" r="1.3"/>
      <circle cx="60.6" cy="79.4" r="1.3"/>
      <circle cx="79.6" cy="62.6" r="1.3"/>
      <circle cx="84" cy="69.5" r="1.3"/>
    </g>

    <!-- mantle -->
    <path d="M26 44 C26 23.5 36 12 50 12 C64 12 74 23.5 74 44 C74 55.5 63.5 62 50 62 C36.5 62 26 55.5 26 44 Z" fill="url(#swim-mantle)" stroke="#00C2C7" stroke-width="4" stroke-linejoin="round"/>
    <path d="M32 41 C31.5 26 38.5 17 45 16" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
    <circle cx="37.5" cy="25" r="1.2" fill="#1AFFD5" opacity=".3"/>
    <circle cx="61" cy="23" r="1.2" fill="#1AFFD5" opacity=".24"/>

    <!-- eyes, driving forward -->
    <circle cx="42" cy="38" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
    <circle cx="58" cy="37" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
    <circle cx="43.2" cy="37.2" r="2.4" fill="#07090F"/>
    <circle cx="59.2" cy="36.2" r="2.4" fill="#07090F"/>
    <circle cx="40" cy="35.9" r="1" fill="#FFFFFF" opacity=".85"/>
    <circle cx="56" cy="34.9" r="1" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- rising bubbles -->
  <g fill="#1AFFD5">
    <circle cx="22" cy="24" r="2.6" opacity=".45"/>
    <circle cx="15" cy="14" r="1.7" opacity=".32"/>
    <circle cx="84" cy="24" r="2.8" opacity=".45"/>
    <circle cx="91" cy="13" r="1.7" opacity=".32"/>
  </g>

  <!-- current lines -->
  <g stroke="#1AFFD5" stroke-width="3.4" stroke-linecap="round" opacity=".65">
    <path d="M6 86 C13 81 20 91 27 86 C34 81 41 91 48 86"/>
    <path d="M54 93 C61 88 68 98 75 93 C82 88 89 96 94 93"/>
  </g>
</svg>
