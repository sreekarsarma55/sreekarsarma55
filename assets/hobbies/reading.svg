  <path d="M50 70 C42 65 31 65 22 68 V86 C31 83 42 83 50 88 C58 83 69 83 78 86 V68 C69 65 58 65 50 70 Z" fill="#0D1117" stroke="#FF00C8" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M50 70 V88" stroke="#FF00C8" stroke-width="2.4"/>
  <g stroke="#1AFFD5" stroke-width="1.8" stroke-linecap="round" opacity=".7">
    <path d="M28 73 C33 72 38 72 44 74"/>
    <path d="M28 78 C33 77 38 77 44 79"/>
    <path d="M56 74 C62 72 67 72 72 73"/>
    <path d="M56 79 C62 77 67 77 72 78"/>
