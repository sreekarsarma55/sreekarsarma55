<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="read-mantle" x1="50" y1="10" x2="50" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A3D48"/>
      <stop offset=".55" stop-color="#0F1A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="read-glow" cx="50" cy="42" r="38" gradientUnits="userSpaceOnUse">
