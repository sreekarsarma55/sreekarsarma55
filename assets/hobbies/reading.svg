  <circle cx="58" cy="40" r="5.4" fill="#F0F0F0" stroke="#00C2C7" stroke-width="1.1"/>
  <circle cx="42.4" cy="42.2" r="2.4" fill="#07090F"/>
  <circle cx="58.4" cy="42.2" r="2.4" fill="#07090F"/>
  <circle cx="40.4" cy="38" r="1" fill="#FFFFFF" opacity=".85"/>
  <circle cx="56.4" cy="38" r="1" fill="#FFFFFF" opacity=".85"/>
  <g stroke="#FF00C8" stroke-width="2.4">
    <circle cx="42" cy="40" r="8"/>
    <circle cx="58" cy="40" r="8"/>
    <path d="M50 40 H50.1" stroke-linecap="round"/>
    <path d="M34 39 L28 36 M66 39 L72 36" stroke-linecap="round"/>
