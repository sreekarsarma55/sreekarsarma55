    <circle cx="21.1" cy="76.7" r="1.3"/>
    <circle cx="77.4" cy="68.3" r="1.3"/>
    <circle cx="78.9" cy="76.7" r="1.3"/>
  </g>

  <!-- mantle -->
  <path d="M26 44 C26 23.5 36 12 50 12 C64 12 74 23.5 74 44 C74 55.5 63.5 62 50 62 C36.5 62 26 55.5 26 44 Z" fill="url(#read-mantle)" stroke="#00C2C7" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 41 C31.5 26 38.5 17 45 16" stroke="#1AFFD5" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
